[package]
name = "dca"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "=29.0.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[lints.rust]
unsafe_code = "forbid"

[workspace]
